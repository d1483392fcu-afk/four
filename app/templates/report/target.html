{% extends 'base.html' %}

{% block title %}減碳目標 - EcoLedger{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">設定減碳目標</h3>
                <form action="{{ url_for('report.target') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">每月目標碳排放量 (kg CO₂e)</label>
                        <input type="number" step="0.1" min="0" class="form-control" name="target_carbon_emission" value="{{ target }}" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">儲存目標</button>
                        <a href="{{ url_for('ledger.index') }}" class="btn btn-outline-secondary">返回首頁</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
